name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Load version from .env
        run: grep -E '^SSP_VERSION=' .env >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: SSP_VERSION=${{ env.SSP_VERSION }}
          tags: |
            ghcr.io/yumuljm/simplesamlphp:${{ env.SSP_VERSION }}
            ghcr.io/yumuljm/simplesamlphp:latest
